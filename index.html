<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="description" content="QwenLoca — Qwen3.5-2B (ONNX) chat that runs 100% in your browser via WebAssembly. Download the model files once, select them locally, chat privately. Works on Android Chrome." />
  <title>QwenLoca · Qwen3.5-2B in your browser</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/base.css?v=4" />
  <link rel="stylesheet" href="css/components.css?v=4" />
  <link rel="stylesheet" href="css/chat.css?v=4" />
</head>
<body>
  <div id="app">

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <div class="brand-text">
          <strong>QwenLoca</strong>
          <span class="brand-sub">Qwen3.5-2B · ONNX · WASM</span>
        </div>
      </div>
      <div id="header-status" class="header-status" hidden></div>
      <div id="header-actions" class="header-actions" hidden>
        <button id="btn-new-chat" class="btn btn-ghost btn-sm" type="button" title="New chat">✚ New chat</button>
        <div class="menu-wrap">
          <button id="btn-model-menu" class="btn btn-ghost btn-sm" type="button" title="Model">⚙ Model</button>
          <div id="model-menu" class="menu" hidden>
            <button type="button" data-action="reload-files">📁 Load model files again</button>
            <button type="button" data-action="redownload">⬇️ Redownload model</button>
            <button type="button" data-action="settings">🎛️ Generation settings</button>
            <button type="button" data-action="info">ℹ️ About / how it works</button>
          </div>
        </div>
      </div>
    </header>

    <main id="wizard-root" class="wizard-root"></main>

    <main id="chat-root" class="chat-root" hidden>
      <div id="chat-scroll" class="chat-scroll">
        <div id="chat-messages" class="chat-messages"></div>
      </div>
      <div id="composer-wrap" class="composer-wrap">
        <div class="composer-inner">
          <textarea id="composer" rows="1" placeholder="Message Qwen3.5-2B… (Enter to send)" autocomplete="off" enterkeyhint="send"></textarea>
          <button id="btn-send" class="btn btn-primary btn-round" type="button" title="Send" aria-label="Send">➤</button>
          <button id="btn-stop" class="btn btn-danger btn-round" type="button" title="Stop" aria-label="Stop" hidden>■</button>
        </div>
        <div class="composer-hint">100% local · runs on your device · nothing is uploaded</div>
      </div>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
  </div>

  <!-- No static <input type="file"> here: app.js creates a fresh one per pick
       (Android Chrome skips 'change' when the same input element is reused). -->

  <script>
    /* Cross-origin isolation for static hosts that can't set COOP/COEP headers
       (e.g. GitHub Pages): register sw.js, then reload once so the document is
       served with the headers and ONNX Runtime can use threaded WASM.
       When the host already sends the headers (server.js), nothing happens. */
    if ('serviceWorker' in navigator && typeof crossOriginIsolated !== 'undefined' && !crossOriginIsolated) {
      window.addEventListener('load', () => {
        const reloadIfNeeded = () => {
          if (!crossOriginIsolated) location.reload();
        };
        navigator.serviceWorker
          .register('sw.js')
          .then(() => {
            if (navigator.serviceWorker.controller) reloadIfNeeded();
            else {
              navigator.serviceWorker.addEventListener('controllerchange', reloadIfNeeded, { once: true });
            }
          })
          .catch(() => { /* SW unavailable — app still works single-threaded */ });
      });
    }
  </script>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
